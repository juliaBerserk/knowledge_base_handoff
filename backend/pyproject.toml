[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "estafeta"
version = "0.1.0"
description = "Эстафета — передача корпоративных знаний"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.12",
    "uvicorn[standard]==0.34.2",
    "pydantic==2.11.3",
    "pydantic-settings==2.8.1",
    "sqlalchemy==2.0.40",
    "alembic==1.15.2",
    "psycopg[binary]==3.2.6",
    "argon2-cffi==23.1.0",
    "cryptography==44.0.2",
    "httpx==0.28.1",
    "python-multipart==0.0.20",
    "email-validator==2.2.0",
    "natasha==1.6.0",
    "pypdf==5.4.0",
    "python-docx==1.1.2",
    "regex==2024.11.6",
    "pgvector==0.4.1",
    "FlagEmbedding==1.3.5",
    "sentence-transformers>=3.4.1,<5",
    "transformers>=4.44.2,<5",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.5",
    "pytest-cov==6.1.1",
    "ruff==0.11.7",
]

[tool.setuptools.packages.find]
include = ["estafeta*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--cov=estafeta.domain.access --cov-branch --cov-report=term-missing --cov-fail-under=100"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["estafeta", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["estafeta"]

[tool.ruff.lint.per-file-ignores]
"tests/conftest.py" = ["E402"]
"estafeta/api/auth.py" = ["B008"]
"estafeta/api/audit.py" = ["B008"]
"estafeta/api/dependencies.py" = ["B008"]
"estafeta/api/materials.py" = ["B008"]
"estafeta/api/knowledge.py" = ["B008"]
"estafeta/api/build_jobs.py" = ["B008"]
