name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test
          POSTGRES_DB: estafeta
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d estafeta"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      APP_SECRET_KEY: test-secret-key-not-for-production-use
      DATABASE_URL: postgresql+psycopg://postgres:test@localhost:5432/estafeta
      DATABASE_OWNER_URL: postgresql+psycopg://postgres:test@localhost:5432/estafeta
      RUN_DB_TESTS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Enable pgvector
        run: python -c "import os; from sqlalchemy import create_engine, text; conn = create_engine(os.environ['DATABASE_URL']).connect(); conn.execute(text('CREATE EXTENSION IF NOT EXISTS vector')); conn.commit(); conn.close()"
      - name: Ruff
        run: ruff check estafeta tests alembic/env.py alembic/versions
      - name: Pytest
        run: pytest -q
      - name: Alembic upgrade
        run: alembic upgrade head

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package.json
      - run: npm install
      - run: npm run build
