name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test
          POSTGRES_DB: estafeta
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d estafeta"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      APP_SECRET_KEY: test-secret-key-not-for-production-use
      DATABASE_URL: postgresql+psycopg://postgres:test@localhost:5432/estafeta
      DATABASE_OWNER_URL: postgresql+psycopg://postgres:test@localhost:5432/estafeta
      RUN_DB_TESTS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Enable pgvector
        run: python -c "import os; from sqlalchemy import create_engine, text; conn = create_engine(os.environ['DATABASE_URL']).connect(); conn.execute(text('CREATE EXTENSION IF NOT EXISTS vector')); conn.commit(); conn.close()"
      - name: Create database roles
        run: |
          psql postgresql://postgres:test@localhost:5432/estafeta -v ON_ERROR_STOP=1 -c "
            CREATE ROLE estafeta_owner LOGIN PASSWORD 'owner-test';
            CREATE ROLE estafeta_app LOGIN PASSWORD 'app-test';
            ALTER DATABASE estafeta OWNER TO estafeta_owner;
            ALTER SCHEMA public OWNER TO estafeta_owner;
            REVOKE ALL ON DATABASE estafeta FROM PUBLIC;
            GRANT CONNECT ON DATABASE estafeta TO estafeta_app, estafeta_owner;
            REVOKE ALL ON SCHEMA public FROM PUBLIC;
            GRANT USAGE, CREATE ON SCHEMA public TO estafeta_owner;
            GRANT USAGE ON SCHEMA public TO estafeta_app;
            ALTER DEFAULT PRIVILEGES FOR ROLE estafeta_owner IN SCHEMA public
              GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO estafeta_app;
            ALTER DEFAULT PRIVILEGES FOR ROLE estafeta_owner IN SCHEMA public
              GRANT USAGE, SELECT ON SEQUENCES TO estafeta_app;
          "
          echo "DATABASE_URL=postgresql+psycopg://estafeta_app:app-test@localhost:5432/estafeta" >> "$GITHUB_ENV"
          echo "DATABASE_OWNER_URL=postgresql+psycopg://estafeta_owner:owner-test@localhost:5432/estafeta" >> "$GITHUB_ENV"
      - name: Apply migrations
        run: alembic upgrade head
      - name: Ruff
        run: ruff check estafeta tests alembic/env.py alembic/versions
      - name: Pytest
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package.json
      - run: npm install
      - run: npm run build
