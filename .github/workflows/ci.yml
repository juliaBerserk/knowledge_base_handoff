name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test
          POSTGRES_DB: estafeta
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d estafeta"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      APP_SECRET_KEY: test-secret-key-not-for-production-use
      DATABASE_URL: postgresql+psycopg://estafeta_app:test@localhost:5432/estafeta
      DATABASE_ADMIN_URL: postgresql+psycopg://estafeta_admin:test@localhost:5432/estafeta
      DATABASE_WORKER_URL: postgresql+psycopg://estafeta_worker:test@localhost:5432/estafeta
      DATABASE_OWNER_URL: postgresql+psycopg://postgres:test@localhost:5432/estafeta
      RUN_DB_TESTS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Enable pgvector and provision app role
        run: |
          python - <<'PY'
          import os
          from sqlalchemy import create_engine, text
          with create_engine(os.environ["DATABASE_OWNER_URL"]).begin() as conn:
              conn.execute(text("CREATE EXTENSION IF NOT EXISTS vector"))
              conn.execute(text("CREATE ROLE estafeta_app LOGIN PASSWORD 'test'"))
              conn.execute(text("CREATE ROLE estafeta_admin LOGIN PASSWORD 'test'"))
              conn.execute(text("CREATE ROLE estafeta_worker LOGIN PASSWORD 'test'"))
              conn.execute(text("GRANT estafeta_app TO estafeta_worker WITH INHERIT TRUE, SET FALSE"))
          PY
      - name: Ruff
        run: ruff check estafeta tests alembic/env.py alembic/versions
      - name: Alembic upgrade
        run: alembic upgrade head
      - name: Alembic schema check
        run: alembic check
      - name: Pytest
        run: pytest -q
      - name: Permission branch coverage
        run: |
          coverage run --branch --include='*/estafeta/core/permissions.py' -m pytest -q tests/test_permissions.py
          coverage report --fail-under=100

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium firefox
      - run: npm run test:e2e
        env:
          E2E: "1"
          E2E_VITE: "1"
          E2E_FIREFOX: "1"

  tls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install cryptography==46.0.7
      - run: python deploy/tests/tls_smoke.py

  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y age
      - run: pip install -e "./backend[dev]"
      - run: python -m pytest -q deploy/tests/test_acceptance.py
      - run: python deploy/tests/backup_smoke.py
